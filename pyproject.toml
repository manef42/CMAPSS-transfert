[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cmapss-transfer"
version = "0.1.0"
description = "Engine-disjoint C-MAPSS LSTM and unsupervised DANN"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.2", "PyYAML>=6", "matplotlib>=3.7"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
cmapss = "cmapss.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
include = ["cmapss*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
